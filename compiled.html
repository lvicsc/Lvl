      const [hours, minutes] = timeStr.split(':').map(Number);
      return hours * 60 + minutes;
    };

    const minutesToTime = (totalMinutes) => {
      let hours = Math.floor(totalMinutes / 60);
      const minutes = Math.floor(totalMinutes % 60);
      hours = hours % 24;
      return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
    };

    const getMinutesFromMidnight = (date) => {
      return date.getHours() * 60 + date.getMinutes();
    };

    const getEventStatus = (startMinutes, endMinutes, currentMinutes) => {
      if (currentMinutes < startMinutes) return 'upcoming';
      if (currentMinutes >= startMinutes && currentMinutes < endMinutes) return 'live';
      return 'completed';
    };

    const formatDuration = (duration) => {
        if (!duration) return '';
        if (duration.includes(':')) {
            const [min, sec] = duration.split(':');
            if (parseInt(min) > 59) { 
                return `${min}m`;
            }
            return parseInt(sec) > 0 ? `${parseInt(min)}m ${sec}s` : `${parseInt(min)}m`;
        }
        return duration;
    };

    const getRelativeTimeText = (targetMinutes, currentMinutes) => {
      const diff = targetMinutes - currentMinutes;
      if (diff > 0 && diff <= 60) {
        return `Starts in ${diff} min`;
      }
      if (diff > 0 && diff <= 120) {
        const hours = Math.floor(diff / 60);
        const mins = diff % 60;
        return `Starts in ${hours}h ${mins}m`;
      }
      return null;

        const getTimes = (item) => {
            const [h, m] = item.startTime.split(':').map(Number);
            const start = h * 60 + m + delayMinutes;
            const [eh, em] = item.endTime.split(':').map(Number);
            const end = eh * 60 + em + delayMinutes;
            return { start, end };
        };

        const current = schedule.find(item => {
            const { start, end } = getTimes(item);
            return currentMinutes >= start && currentMinutes < end;
        });

        const next = schedule.find(item => {
            const { start } = getTimes(item);
            return start > currentMinutes && item.type !== 'Panel Reset' && item.team !== 'Resurface';
        });
        
        const competitionItems = schedule.filter(i => i.type !== 'Break' && i.type !== 'Panel Reset');
        const completed = competitionItems.filter(item => {
             const { end } = getTimes(item);
             return currentMinutes >= end;
        }).length;

        return { 
            currentEvent: current, 
            nextEvent: next,
            progress: Math.round((completed / competitionItems.length) * 100),
        };

                                            </div>
                                            <button 
                                                onClick={() => onToggleFavorite(item.id)}
                                                className="text-amber-400 hover:text-amber-500 p-1 -mr-1"
                                            >
                                                <Star size={14} fill="currentColor" />
                                            </button>
                                        </div>
                                    </div>
                                 );
                            })}
                        </div>
                    ) : (
                        <div className="text-center py-8 text-slate-400 text-xs italic bg-slate-50 rounded-xl border border-slate-100">
                            No other starred teams found.
                        </div>
                    )}
                </section>
            </div>
        );
    };

    // --- App.tsx ---
    const App = () => {
      // -- State --
      const [isLiveMode, setIsLiveMode] = useState(true);
      const [currentTime, setCurrentTime] = useState(() => getMinutesFromMidnight(new Date()));
      const [delayMinutes, setDelayMinutes] = useState(0);
      const [selectedDay, setSelectedDay] = useState('Saturday'); 
      
      // View State
      const [isSidePanelOpen, setIsSidePanelOpen] = useState(false);
      const [currentView, setCurrentView] = useState('schedule');
      const [homeTeam, setHomeTeam] = useState(() => {
          return localStorage.getItem('synchroHomeTeam');
      });

      // Filter & User Preference state
      const [searchTerm, setSearchTerm] = useState('');
      const [activeTab, setActiveTab] = useState('all');
      const [favorites, setFavorites] = useState(() => {
          try {
              const saved = localStorage.getItem('synchroFavorites');
              return saved ? new Set(JSON.parse(saved)) : new Set();
          } catch (e) {
              return new Set();
          }
      });

      // -- Effects --

      // Live Clock & Date Logic
      useEffect(() => {
        const updateTime = () => {
            const now = new Date();
            setCurrentTime(getMinutesFromMidnight(now));
            
            if (isLiveMode) {
                const day = now.getDay(); 
                if (day === 5) setSelectedDay('Friday');
                else if (day === 6) setSelectedDay('Saturday');
            }
        };

        if (isLiveMode) {
          updateTime(); 
          const interval = setInterval(updateTime, 10000); 
          return () => clearInterval(interval);
        }
      }, [isLiveMode]);

      // Persist Favorites & Home Team
      useEffect(() => {
          localStorage.setItem('synchroFavorites', JSON.stringify(Array.from(favorites)));
      }, [favorites]);

      useEffect(() => {
          if (homeTeam) localStorage.setItem('synchroHomeTeam', homeTeam);
          else localStorage.removeItem('synchroHomeTeam');
      }, [homeTeam]);

      // Handlers
      const toggleFavorite = (id) => {
          const newFavs = new Set(favorites);
          if (newFavs.has(id)) {
              newFavs.delete(id);
          } else {
              newFavs.add(id);
          }
          setFavorites(newFavs);
      };

      const handleSetHomeTeam = (team) => {
          setHomeTeam(team);
          if (team) {
              setCurrentView('teams');
          }
      };

      // -- Computed --
      const filteredSchedule = useMemo(() => {
        return RAW_SCHEDULE.filter(item => {
          if (item.day !== selectedDay) return false;

          const matchesSearch = searchTerm === '' || 
             item.team.toLowerCase().includes(searchTerm.toLowerCase()) ||
             item.category.toLowerCase().includes(searchTerm.toLowerCase());
          
          let matchesTab = true;
          if (activeTab === 'practice') matchesTab = item.type === EventType.PRACTICE || item.type === EventType.BREAK;
          if (activeTab === 'competition') matchesTab = item.type === EventType.COMPETITION || item.type === EventType.BREAK || item.type === EventType.PANEL_RESET || item.type === EventType.PRESENTATION;
          if (activeTab === 'favorites') matchesTab = favorites.has(item.id);
          
          return matchesSearch && matchesTab;
        });
      }, [searchTerm, activeTab, favorites, selectedDay]);

      return (
        <div className="min-h-screen bg-slate-50 pb-40 font-sans text-slate-900">
          
          {/* Side Panel */}
          <SidePanel 
            isOpen={isSidePanelOpen} 
            onClose={() => setIsSidePanelOpen(false)}
            currentView={currentView}
            onChangeView={setCurrentView}
            favCount={favorites.size}
            homeTeam={homeTeam}
          />

          {/* Header */}
          <header className="bg-white/95 backdrop-blur-sm border-b border-slate-200 sticky top-0 z-40 transition-all shadow-sm">
            <div className="max-w-3xl mx-auto px-4 py-3">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-3">
                    <button 
                        onClick={() => setIsSidePanelOpen(true)}
                        className="p-2 -ml-2 text-slate-600 hover:bg-slate-100 rounded-full transition-colors"
                    >
                        <Menu size={20} />
                    </button>
                    <div>
                        <h1 className="text-lg font-bold text-slate-900 tracking-tight flex items-center gap-2">
                            Skate London
                            {isLiveMode && <span className="flex h-2 w-2 rounded-full bg-rose-500 animate-pulse shadow-[0_0_8px_rgba(244,63,94,0.6)]"></span>}
                        </h1>
                        <div className="flex items-center gap-3 text-[11px] font-semibold text-slate-500 uppercase tracking-wider mt-0.5">
                            <span className="flex items-center gap-1"><Calendar size={10} /> {currentView === 'schedule' ? EVENT_DATES[selectedDay] : 'My Teams'}</span>
                        </div>
                    </div>
                </div>
              </div>
              
              {/* Filter Tabs - Only show in schedule view */}
              {currentView === 'schedule' && (
                <div className="flex items-center gap-2 overflow-x-auto no-scrollbar">
                    <button 
                    onClick={() => setActiveTab('all')}
                    className={`flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold transition-all border ${activeTab === 'all' ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200 hover:border-slate-300'}`}
                    >
                    All Events
                    </button>
                    <button 
                    onClick={() => setActiveTab('practice')}
                    className={`flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold transition-all border ${activeTab === 'practice' ? 'bg-cyan-600 text-white border-cyan-600' : 'bg-white text-slate-600 border-slate-200 hover:border-cyan-300 hover:text-cyan-700'}`}
                    >
                    Practice
                    </button>
                    <button 
                    onClick={() => setActiveTab('competition')}
                    className={`flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold transition-all border ${activeTab === 'competition' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-200 hover:border-indigo-300 hover:text-indigo-700'}`}
                    >
                    Competition
                    </button>
                    <button 
                    onClick={() => setActiveTab('favorites')}
                    className={`flex-shrink-0 flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-bold transition-all border ${activeTab === 'favorites' ? 'bg-amber-400 text-white border-amber-400' : 'bg-white text-slate-600 border-slate-200 hover:border-amber-300 hover:text-amber-600'}`}
                    >
                    <Star size={10} fill={activeTab === 'favorites' ? "currentColor" : "none"}/>
                    <span className="tabular-nums">{favorites.size}</span>
                    </button>
                </div>
              )}
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-3xl mx-auto px-3 pt-4">
            
            {currentView === 'schedule' ? (
                <React.Fragment>
                    {/* Live Dashboard */}
                    {!searchTerm && activeTab !== 'favorites' && (
                        <StatusDashboard 
                            schedule={filteredSchedule} 
                            currentMinutes={currentTime} 
                            delayMinutes={delayMinutes} 
                        />
                    )}

                    {!isLiveMode && (
                        <div className="flex justify-between items-center bg-amber-50 border border-amber-100 text-amber-800 px-3 py-2 rounded-lg mb-4 text-xs font-medium">
                            <div className="flex items-center gap-2">
                                <Clock size={14} />
                                <span>Manual Time Mode Active</span>
                            </div>
                            <button onClick={() => setIsLiveMode(true)} className="text-amber-600 hover:underline">Switch to Live</button>
                        </div>
                    )}

                    {/* Schedule List */}
                    <div className="relative pb-24">
                        {/* Continuous Timeline Line Background (Left side) */}
                        <div className="absolute left-[19px] top-2 bottom-0 w-px bg-slate-200 -z-10 hidden md:block"></div>

                        {filteredSchedule.length > 0 ? (
                            <div className="space-y-2">
                            {filteredSchedule.map((item, index) => (
                                <EventCard 
                                    key={item.id} 
                                    item={item} 
                                    currentMinutes={currentTime} 
                                    delayMinutes={delayMinutes}
                                    isFavorite={favorites.has(item.id)}
                                    isHomeTeam={homeTeam === item.team}
                                    onToggleFavorite={toggleFavorite}
                                    onSetHomeTeam={handleSetHomeTeam}
                                    isLast={index === filteredSchedule.length - 1}
                                />
                            ))}
                            </div>
                        ) : (
                            <div className="flex flex-col items-center justify-center py-12 text-center bg-white rounded-xl border border-slate-200 border-dashed">
                                <div className="bg-slate-50 p-3 rounded-full mb-2">
                                    <Filter className="text-slate-300" size={24} />
                                </div>
                                <h3 className="text-slate-900 font-semibold text-sm mb-1">No events found</h3>
                                <p className="text-slate-500 text-xs max-w-[200px] mx-auto">
                                    {activeTab === 'favorites' 
                                        ? "Tap the star icon on any event to add it to your favorites." 
                                        : "No events match your filters for this day."}
                                </p>
                            </div>
                        )}
                    </div>
                </React.Fragment>
            ) : (
                <TeamsView 
                    homeTeam={homeTeam}
                    favorites={favorites}
                    schedule={RAW_SCHEDULE} 
                    currentMinutes={currentTime}
                    delayMinutes={delayMinutes}
                    onSetHomeTeam={handleSetHomeTeam}
                    onToggleFavorite={toggleFavorite}
                />
            )}
          </main>

          {/* Floating Controls */}
          <ControlPanel 
             delayMinutes={delayMinutes} 
             setDelayMinutes={setDelayMinutes}
             searchTerm={searchTerm}
             setSearchTerm={setSearchTerm}
             currentTime={currentTime}
             setCurrentTime={setCurrentTime}
             isLiveMode={isLiveMode}
             setIsLiveMode={setIsLiveMode}
             selectedDay={selectedDay}
             setSelectedDay={setSelectedDay}
          />

        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
